<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
   <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>festive-frozen</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              display: ['Montserrat', 'sans-serif'],
              body: ['Plus Jakarta Sans', 'sans-serif'],
            },
            fontSize: {
              'display-lg': ['48px', { lineHeight: '56px', fontWeight: '700', letterSpacing: '-0.02em' }],
              'display-lg-mobile': ['32px', { lineHeight: '40px', fontWeight: '700', letterSpacing: '-0.01em' }],
              'headline-md': ['24px', { lineHeight: '32px', fontWeight: '600' }],
              'headline-sm': ['20px', { lineHeight: '28px', fontWeight: '600' }],
              'body-lg': ['18px', { lineHeight: '28px', fontWeight: '400' }],
              'body-md': ['16px', { lineHeight: '24px', fontWeight: '400' }],
              'label-md': ['14px', { lineHeight: '20px', fontWeight: '600', letterSpacing: '0.01em' }],
              'label-sm': ['12px', { lineHeight: '16px', fontWeight: '500' }],
            },
            borderRadius: {
              sm: '0.25rem',
              DEFAULT: '0.5rem',
              md: '0.75rem',
              lg: '1rem',
              xl: '1.5rem',
              full: '9999px',
            },
          },
        },
      }
    </script>
  </body>
</html>
