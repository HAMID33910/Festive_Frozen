services:
  - type: web
    name: festive-frozen-backend
    runtime: node
    region: oregon
    rootDir: Backend
    buildCommand: npm install
    startCommand: node backend.js
    envVars:
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: EMAIL
        sync: false
      - key: EMAIL_PASSWORD
        sync: false
      - key: NODE_ENV
        value: production
